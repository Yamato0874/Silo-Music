[package]
name = "silo-native"
version = "1.0.0"
edition = "2021"
description = "Silo Player — нативный интерфейс (egui) поверх ядра silo-core"

[[bin]]
name = "silo-native"
path = "src/main.rs"

[dependencies]
silo-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
wry = "0.57"
souvlaki = "0.9"
tray-icon = "0.26"
global-hotkey = "0.10"
rfd = "0.18"
hound = "3.5"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
notify-rust = "4"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"
